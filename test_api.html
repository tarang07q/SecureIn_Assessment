<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>Recipe API Test</h1>
    <button onclick="testAPI()">Test API Connection</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Loading...</p>';
            
            try {
                const response = await fetch('http://localhost:3000/api/recipes?page=1&limit=3');
                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <h2>Success! ✅</h2>
                    <p><strong>Total recipes:</strong> ${data.total}</p>
                    <p><strong>Recipes returned:</strong> ${data.data.length}</p>
                    <h3>First Recipe:</h3>
                    <pre>${JSON.stringify(data.data[0], null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <h2>Error ❌</h2>
                    <p style="color: red;">${error.message}</p>
                    <p>Make sure the backend server is running on port 3000</p>
                `;
            }
        }
    </script>
</body>
</html>
